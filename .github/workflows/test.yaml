name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo build --all-features
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: echo LIBRARY_PATH=$(brew --prefix)/lib >> ${{ github.env }}
        if: runner.os == 'macOS'
      - run: cargo test --all-features
  sanitize:
    runs-on: ubuntu-26.04
    # cspell: ignore rustdocflags rustflags zbuild zsanitizer
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: yq -i '.toolchain.channel = "nightly"' rust-toolchain.toml
      - run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -- --skip ui --exact
  bench:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo bench
  dialect_build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo install cargo-expand
      - run: cd melior && cargo expand --all-features dialect::ods > ~/current.rs
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - run: cd melior && cargo expand --all-features dialect::ods > ~/main.rs
      - run: diff ~/main.rs ~/current.rs || true
  test:
    needs:
      - bench
      - build
      - dialect_build
      - sanitize
      - unit_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
