name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo build --all-features
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: echo LIBRARY_PATH=$(brew --prefix)/lib >> ${{ github.env }}
        if: runner.os == 'macOS'
      - run: cargo test --all-features
  sanitize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: sed -i s/stable/nightly/ rust-toolchain.toml
      # TODO Make sanitized tests succeed.
      - run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
        continue-on-error: true
  bench:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo bench
  dialect_build:
    # TODO Remove this job when refactoring of dialect macros is done.
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo install cargo-expand
      - run: cd melior && cargo expand --all-features dialect::ods > ~/current.rs
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - run: cd melior && cargo expand --all-features dialect::ods > ~/main.rs
      - run: |
          diff -u ~/main.rs ~/current.rs > ~/dialect.diff || [ $? -eq 1 ]
          cat ~/dialect.diff
      # Pull requests from forks get read-only tokens, so their diffs are only in the log above.
      - run: |
          marker='<!-- dialect-diff -->'
          id=$(gh api --paginate repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)

          if [ ! -s ~/dialect.diff ] && [ -z "$id" ]; then
            exit
          fi

          {
            echo "$marker"

            if [ -s ~/dialect.diff ]; then
              echo 'Generated dialect code differs from `main`.'
              echo '```diff'
              awk '(size += length + 1) <= 60000' ~/dialect.diff
              echo '```'
              echo "See [the job log]($RUN_URL) for the full diff."
            else
              echo 'Generated dialect code is identical to `main`.'
            fi
          } > ~/comment.md

          if [ -n "$id" ]; then
            gh api --method PATCH repos/$GITHUB_REPOSITORY/issues/comments/$id -F body=@$HOME/comment.md
          else
            gh api repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments -F body=@$HOME/comment.md
          fi
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/checkout@v7.0.1
  test:
    needs:
      - build
      - unit_test
      - bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
