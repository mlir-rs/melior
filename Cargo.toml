[workspace]
resolver = "3"
members = ["macro", "melior"]

[workspace.package]
version = "0.28.2"
edition = "2024"
readme = "README.md"
repository = "https://github.com/mlir-rs/melior"
license = "Apache-2.0"
keywords = ["llvm", "mlir"]

[profile.release]
lto = true

# LLVM 24 support is not released yet: build against the branches that add it.
# Drop this once mlir-sys 240.0.0 and a tblgen release with `llvm24-0` are on crates.io.
[patch.crates-io]
mlir-sys = { git = "https://github.com/yw-furiosa/mlir-sys", branch = "llvm-24" }
tblgen = { git = "https://github.com/yw-furiosa/tblgen-rs", branch = "llvm-24" }
